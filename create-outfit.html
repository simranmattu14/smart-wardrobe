<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StyleMe</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/assets/css/style.css">
        <link rel="stylesheet" href="/assets/css/create-outfit.css">
        <script
            defer
            crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_aGlwLW1hbGxhcmQtMzguY2xlcmsuYWNjb3VudHMuZGV2JA"
            src="https://hip-mallard-38.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
            type="text/javascript">
        </script>
    </head>
    <body>
        <header>
            <p id="logo" onclick="toggleMenu()">Smart Wardrobe</p>
            <nav id="navbar">
                <a href="index.html"><i class="fa fa-home" style="font-size:14px;"></i> Home</a>
                <a href="wardrobe.html"><i class="fa fa-bars" style="font-size:14px;"></i> Wardrobe</a>
                <a href="add-item.html"><i class="fa fa-plus" style="font-size:14px;"></i> Add Item</a>
                <a class="clicked" href="create-outfit.html"><i class="fa fa-puzzle-piece" aria-hidden="true"></i> Create Outfit</a>
                <a href="outfits.html"><i class="fa-solid fa-shirt"></i> My Outfits</a>
                <a href="ai-stylist.html"><i class="fa-solid fa-magic"></i> AI Stylist</a>
            </nav>
        </header>
        <section class="intro">
            <h1>Create New Outfit</h1>
            <p>Design your perfect look by combining pieces from your wardrobe.</p>
        </section>
        <section id="create-outfit-form" class="main">
            <form id="outfitForm">
                <!-- Outfit Name -->
                <label> Outfit Name *</label>
                <input 
                    type="text" 
                    id="outfitName" 
                    placeholder="e.g. Summer Casual"
                    required>

                <section class="scroll-container" id="top-selection">
                    <div class="item-selection" id="topSelection">
                        <h2>Top</h2>
                        <p>Select a top from your wardrobe.</p>
                        <div class="item-grid" id="topGrid">
                            <!-- Items will be dynamically added here -->
                        </div>
                    </div>
                    <div class="item-selection" id="bottomSelection">
                        <h2>Bottom</h2>
                        <p>Select a bottom from your wardrobe.</p>
                        <div class="item-grid" id="bottomGrid">
                            <!-- Items will be dynamically added here -->
                        </div>
                </section>
                <button type="submit" class="submit-button">Create Outfit</button>
        </section>

        <footer>
            Copyright © 2024 Smart Wardrobe. All rights reserved.
        </footer>
    </body>
    <script src="/assets/js/navigation.js"></script>
    <script type="module" src="/assets/js/create-outfit.js"></script>
</html>
