<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StyleMe</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/assets/css/style.css">
        <link rel="stylesheet" href="/assets/css/login.css">
    </head>
    <body>
        <header>
            <p id="logo" onclick="toggleMenu()">Smart Wardrobe</p>
            <nav id="navbar">
                <a href="index.html"><i class="fa fa-home" style="font-size:14px;"></i> Home</a>
                <a href="wardrobe.html"><i class="fa fa-bars" style="font-size:14px;"></i> Wardrobe</a>
                <a href="add-item.html"><i class="fa fa-plus" style="font-size:14px;"></i> Add Item</a>
                <a href="create-outfit.html"><i class="fa fa-puzzle-piece" aria-hidden="true"></i> Create Outfit</a>
                <a href="outfits.html"><i class="fa-solid fa-shirt"></i> My Outfits</a>
                <a href="ai-stylist.html"><i class="fa-solid fa-magic"></i> AI Stylist</a>
            </nav>
        </header>
        <section class="intro">
            <p></p>
        </section>
        <form id="signin-content">
            <section id="signin">
                <h1> Sign In </h1>
            </section>
            <div class="inputBox">
                <input type="text" id="login-email" placeholder="" required>
                <label for=""> Email </label>
                <ion-icon name="mail-outline"></ion-icon>
            </div>
            <div class="inputBox">
                <input type="text" id="login-password" placeholder="" required>
                <label> Password </ion-icon> </label>
                <ion-icon name="lock-closed-outline"></ion-icon>
            </div>
            <div class="forget">
                <div id="remember">
                    <label> Remember me</label>
                    <input id="remember-me" type="checkbox">
                </div>
                <a href="#">Forget Password</a>
            </div>
            <div class="intputBox">
                <input type="submit" value="Login">
            </div>
            <div class="register">
                <label>Don't have an account? <a href="#">Register</a></label>
            </div>
        </form>
        <footer>
            Copyright © 2026 Smart Wardrobe. All rights reserved.
        </footer>
    </body>
    <script src="/assets/js/navigation.js"></script>
    <script src="/assets/js/remember.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ionicons@5.5.3/dist/ionicons/ionicons.js"></script>
</html>
